<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102833"><title>Teacher Tools</title><meta name="description" content="A simple launcher for useful teacher utilities."><style>:root{--bg:#0b1e28;--ink:#18313b;--muted:#617680;--gold:#d6a84d;--teal:#2d7f7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 5%,rgba(214,168,77,.28),transparent 28%),radial-gradient(circle at 5% 95%,rgba(45,127,122,.32),transparent 35%),linear-gradient(145deg,#071d27,#143d48);background-attachment:fixed}header,main,footer{width:min(1160px,calc(100% - 36px));margin:auto}header{padding:54px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:22px}.brand{display:flex;align-items:center;gap:18px}.mark{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-weight:900;font-size:22px;background:linear-gradient(145deg,#f1d28f,#d5a647);box-shadow:0 12px 30px rgba(0,0,0,.2);transform:rotate(-3deg)}.eyebrow{margin:0 0 4px;color:#e6ca83;font-size:11px;font-weight:800;letter-spacing:.18em}h1{margin:0;color:white;font-size:clamp(38px,6vw,62px);line-height:.98;letter-spacing:-.045em}.tagline{margin:10px 0 0;color:rgba(255,255,255,.72)}.statusbar{display:flex;gap:8px;flex-wrap:wrap}.pill,.filter{border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.07)}.pill{padding:7px 11px;font-size:12px;font-weight:700}.devbadge{color:#18313b;background:#e5c982;border-color:#e5c982}.controls{position:sticky;top:10px;z-index:10;display:grid;grid-template-columns:minmax(250px,390px) 1fr;gap:12px;align-items:center;padding:12px;margin-bottom:20px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(8,31,40,.75);backdrop-filter:blur(16px)}input{width:100%;border:0;outline:0;border-radius:13px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff}.filters{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.filter{padding:8px 11px;font-size:12px;font-weight:750;cursor:pointer}.filter.active{color:#17333d;background:#f1d28f;border-color:#f1d28f}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:70px}.card{display:flex;flex-direction:column;min-height:300px;padding:22px;border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(245,249,248,.92));box-shadow:0 18px 55px rgba(3,21,29,.18);transition:.18s ease}.card:hover{transform:translateY(-4px)}.top{display:flex;justify-content:space-between;align-items:start}.icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:#edf7f5;font-size:23px}.state{padding:5px 8px;border-radius:999px;background:#edf2f2;color:#41606a;font-size:10px;font-weight:850;text-transform:uppercase}.state.live,.state.in-use{color:#257050;background:#e8f5ef}.state.development{color:#785b1a;background:#f7edce}.card h2{margin:17px 0 6px;font-size:23px}.cat{margin:0 0 12px;color:var(--teal);font-size:11px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.desc{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tag{padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.7);border:1px solid rgba(24,49,59,.08);font-size:10px;color:#667b83;font-weight:700}.spacer{flex:1;min-height:18px}.action,.devlink{display:inline-flex;justify-content:center;align-items:center;text-decoration:none;font-weight:800}.action{min-height:43px;padding:9px 12px;border-radius:12px;font-size:13px}.action.good{color:white;background:#173f4b}.action.missing{color:#7a8b91;background:#eef2f2}.devpanel{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(24,49,59,.18)}body.dev .devpanel{display:block}.devlinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.devlink{min-height:34px;padding:7px;border-radius:9px;border:1px solid rgba(24,49,59,.1);color:#37545e;background:white;font-size:11px}.devlink.off{color:#9aa7ab;background:#f2f5f5;pointer-events:none}.note{margin:9px 0 0;color:#76878d;font-size:11px;line-height:1.45}.devtitle{margin-bottom:8px;color:#8a681f;font-size:11px;font-weight:900;text-transform:uppercase}.empty{padding:60px 0;text-align:center;color:white}footer{display:flex;justify-content:space-between;align-items:center;padding-bottom:28px;color:rgba(255,255,255,.45);font-size:12px}.devtoggle{width:34px;height:28px;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.25);background:rgba(255,255,255,.03);cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr}.filters{justify-content:flex-start}}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.mark{width:55px;height:55px}.grid{grid-template-columns:1fr}.controls{top:6px}}</style></head><body><header><div class="brand"><div class="mark">TT</div><div><p class="eyebrow">TEACHER TOOLKIT</p><h1>Teacher Tools</h1><p class="tagline">Small tools for annoying teacher jobs.</p></div></div><div class="statusbar"><span id="count" class="pill"></span><span id="devbadge" class="pill devbadge" hidden>Developer Mode</span></div></header><main><section class="controls"><input id="search" type="search" placeholder="Search tools…" aria-label="Search tools"><div id="filters" class="filters"></div></section><section id="empty" class="empty" hidden><h2>No tools found</h2><p>Try another search or category.</p></section><section id="grid" class="grid"></section></main><footer><span>Useful little things, all in one place.</span><button id="devtoggle" class="devtoggle" title="Developer options">&lt;/&gt;</button></footer><script>const T=[{id:'docx-to-docs',title:'Docx → Google Docs',description:'Convert Word documents into native Google Docs without the usual manual upload-and-convert dance.',category:'Documents',icon:'↗',status:'In use',tags:['Google Drive','Docs','Conversion'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Existing standalone converter. Deployment links still need to be recovered.'},{id:'file-renamer',title:'File Renamer',description:'Bulk rename Google Drive files — especially useful for stripping “Copy of” from duplicated teaching resources.',category:'Files',icon:'Aa',status:'Live',tags:['Google Drive','Files','Bulk action'],userUrl:'https://workspace.google.com/marketplace/app/multiple_file_rename_for_google_drive/783878738456',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Third-party Workspace add-on already documented in the teaching Drive.'},{id:'knk-schedule-maker',title:'KnK Schedule Maker',description:'Build the KnK schedule without wrestling with the same repetitive timetable setup every time.',category:'Scheduling',icon:'▦',status:'In use',tags:['Schedule','Timetable'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Deployment/source links still need to be recovered.'},{id:'classroom-post-manager',title:'Classroom Post Manager',description:'Copy scheduled Assignments and Materials from a master Google Classroom into multiple target classes with class-specific dates.',category:'Classroom',icon:'✎',status:'In use',tags:['Google Classroom','Scheduling','Apps Script'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Source/context recovered; deployment/project URL pending.'},{id:'copyfolder',title:'CopyFolder',description:'Copy a Google Drive folder tree while preserving the useful structure that ordinary Drive copying makes awkward.',category:'Drive',icon:'⧉',status:'Legacy',tags:['Google Drive','Folders','Copy'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Legacy utility and one of the reference tools for Drive Reorganizer.'},{id:'bulk-transfer-owner',title:'Bulk Transfer Owner',description:'Transfer ownership of multiple Google Drive files in a selected folder instead of changing them one by one.',category:'Drive',icon:'⇄',status:'In use',tags:['Google Drive','Ownership','Bulk action'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Works with Drive sharing and ownership rules.'},{id:'split-day-docs',title:'Split into Day Docs',description:'Split a long Google Doc into separate day documents based on Heading 1 markers such as Day 1, Day 2 and so on.',category:'Documents',icon:'✂',status:'In use',tags:['Google Docs','Automation','Intensives'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'',conversationUrl:'',notes:'Built for day-based teaching documents.'},{id:'laptop-booking-calendar',title:'Laptop Booking Calendar',description:'Shared calendar for checking laptop availability, making bookings by lesson period, and reporting laptop problems.',category:'Scheduling',icon:'▣',status:'In use',tags:['Apps Script','Google Sheets','Bookings'],userUrl:'',scriptUrl:'',sourceUrl:'',dataUrl:'https://docs.google.com/spreadsheets/d/1ahMwspdvDq4xpxMV47F_d6N073R5s2rHGRIkbu9i8nw/edit',conversationUrl:'',notes:'Backing sheet verified. Deployed web-app URL still needs to be recovered.'},{id:'drive-reorganizer',title:'Drive Reorganizer',description:'A broader Drive management console combining folder copying, ownership cleanup, Office conversion and reporting.',category:'Development',icon:'⌘',status:'Development',tags:['Google Drive','Conversion','Admin'],userUrl:'',scriptUrl:'',sourceUrl:'https://github.com/Andyc24uk/drive-reorganizer',dataUrl:'',conversationUrl:'',notes:'Development project; repository exists but is currently empty.'}];let S={category:'All',search:'',dev:localStorage.getItem('teacherToolsDevMode')==='true'};const $=id=>document.getElementById(id),grid=$('grid'),filters=$('filters'),search=$('search');const safe=u=>/^https?:\/\//i.test((u||'').trim())?u:'';const slug=s=>(s||'').toLowerCase().replace(/\s+/g,'-');const link=(u,label,c='devlink')=>safe(u)?`<a class="${c}" href="${u}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<span class="${c} off">${label} · not added</span>`;function card(t){const open=safe(t.userUrl)?`<a class="action good" href="${t.userUrl}" target="_blank" rel="noopener noreferrer">Open Tool ↗</a>`:`<span class="action missing">Open Tool · link pending</span>`;return `<article class="card"><div class="top"><div class="icon">${t.icon}</div><span class="state ${slug(t.status)}">${t.status}</span></div><h2>${t.title}</h2><p class="cat">${t.category}</p><p class="desc">${t.description}</p><div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="spacer"></div>${open}<div class="devpanel"><div class="devtitle">Developer · ${t.id}</div><div class="devlinks">${link(t.scriptUrl,'Apps Script')}${link(t.sourceUrl,'Source')}${link(t.dataUrl,'Data sheet')}${link(t.conversationUrl,'Build chat')}${link(t.userUrl,'User page')}</div><p class="note">${t.notes}</p></div></article>`}function visible(){const q=S.search.toLowerCase().trim();return T.filter(t=>(S.category==='All'||t.category===S.category)&&(!q||[t.title,t.description,t.category,t.status,...t.tags,t.notes].join(' ').toLowerCase().includes(q)))}function render(){const a=visible();grid.innerHTML=a.map(card).join('');$('empty').hidden=!!a.length;$('count').textContent=a.length===T.length?`${T.length} tools`:`${a.length} of ${T.length} tools`}function renderFilters(){const cs=['All',...new Set(T.map(t=>t.category))];filters.innerHTML=cs.map(c=>`<button class="filter ${S.category===c?'active':''}" data-c="${c}">${c}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.category=b.dataset.c;renderFilters();render()})}function syncDev(){document.body.classList.toggle('dev',S.dev);$('devbadge').hidden=!S.dev;localStorage.setItem('teacherToolsDevMode',S.dev)}search.oninput=()=>{S.search=search.value;render()};$('devtoggle').onclick=()=>{S.dev=!S.dev;syncDev()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='d'){e.preventDefault();S.dev=!S.dev;syncDev()}});if(new URLSearchParams(location.search).get('dev')==='1')S.dev=true;renderFilters();render();syncDev();</script></body></html>
